# 日本語の文言（config.i18n.default_locale = :ja）。
# モデルの検証メッセージは errors.format＋属性名＋errors.messages で組み立てる（例: 「タイトル」＋「を入力してください」）
ja:
  activerecord:
    models:
      book: 本
      user: ユーザー
      tag: タグ
      hidden_tag: 隠したタグ
      invitation: 招待
      book_status_event: 状態の履歴
    attributes:
      book:
        title: タイトル
        author: 著者
        status: ステータス
        genre: ジャンル
        media_type: 形態
        rating: 評価
        memo: メモ
        isbn: ISBN
        cover_url: 表紙の画像
        user: ユーザー
      user:
        email: メールアドレス
        password: パスワード
      tag:
        name: タグ名
      hidden_tag:
        name: タグ名
        user: ユーザー
      invitation:
        code: 招待コード
        expires_at: 有効期限
      book_status_event:
        occurred_on: 日付

  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: を入力してください
      required: を入力してください
      too_long: は%{count}文字以内で入力してください
      too_short: は%{count}文字以上で入力してください
      inclusion: は一覧にありません
      taken: はすでに使われています
      invalid: は不正な値です

  # コントローラが返すエラー（{ errors: [...] } の中身）
  api:
    errors:
      login_required: ログインが必要です
      forbidden: 権限がありません
      too_many_attempts: 試行回数が多すぎます。しばらくしてから再度お試しください
      invalid_login: メールアドレスまたはパスワードが違います
      wrong_current_password: 現在のパスワードが違います
      password_too_short: "%{label}は %{count} 文字以上にしてください"
      password_mismatch: "%{label}（確認）が一致しません"
      password_label: パスワード
      new_password_label: 新しいパスワード
      invalid_invitation: 招待コードが無効です
      email_taken: このメールアドレスは登録済みです
      email_invalid: メールアドレスの形式が正しくありません
      last_admin: 最後の管理者は削除できません
      invalid_reset_link: 再設定リンクが無効か、期限切れです
      user_not_found: ユーザーが見つかりません
      invitation_not_found: 招待が見つかりません
      used_invitation: 使用済みの招待は削除できません
      book_not_found: 本が見つかりません
      invalid_isbn: ISBN が不正です
      hidden_tag_name_blank: タグ名を入力してください
      hidden_tag_not_found: 隠したタグが見つかりません
      # タグの管理（MyTags）。自分の本のタグだけを付け替える・外す
      tags:
        not_found: 「%{name}」のタグが付いた本がありません
        new_name_blank: 新しい名前を入力してください
        new_name_too_long: 新しい名前は %{count} 文字以内にしてください
        same_name: 今と同じ名前です
        spelling_admin_only: 書き方（大文字・小文字、ひらがな・カタカナ、濁点・半濁点など）だけの変更は、管理者だけができます
      # CSV 読み込み（BookCsvImporter）。行のエラーは「%{line} 行目：…」の形で返す
      csv_import:
        row: "%{line} 行目：%{message}"
        malformed: CSV ファイルの形が正しくありません（%{detail}）
        no_title_column: 1 行目に「タイトル」の列が見つかりません。書き出した CSV と同じ見出しにしてください
        empty: 取り込む本がありません（2 行目から本を書いてください）
        too_many_rows: 一度に取り込めるのは %{max} 冊までです（%{count} 冊ありました）
        title_blank: タイトルを入力してください
        invalid_label: "%{column}は「%{choices}」のどれかにしてください（「%{value}」は使えません）"
        invalid_rating: 評価は 1〜5 の数字か空欄にしてください（「%{value}」は使えません）
        invalid_date: "%{column}は 2026-09-01 の形（年-月-日）か空欄にしてください（「%{value}」は使えません）"
