name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rails test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: reading_board_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      # mysql2 gem のネイティブ拡張ビルドに必要
      - name: Install libmysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true
          working-directory: backend

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test

  backend-lint:
    name: Backend (lint + security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # mysql2 gem のネイティブ拡張ビルドに必要
      - name: Install libmysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true
          working-directory: backend

      # 書き方のチェック（Rails 8 標準の rubocop-rails-omakase）
      - name: RuboCop
        run: bin/rubocop -f github

      # Rails のセキュリティ上の弱点を静的に検査
      - name: Brakeman
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error

      # 使っている gem の既知の脆弱性を検査
      - name: bundler-audit
        run: bin/bundler-audit

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 書き方のチェック（ESLint）と見た目の整形チェック（Prettier）
      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Run tests (vitest)
        run: npm test

      - name: Build (type-check + vite build)
        run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Format check
        run: terraform fmt -check -recursive

      # AWS 認証情報は CI に置かない（plan / apply は手元で実行）
      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
