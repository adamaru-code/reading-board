name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rails test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: reading_board_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7

      # mysql2 gem のネイティブ拡張ビルドに必要
      - name: Install libmysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true
          working-directory: backend

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test

  backend-lint:
    name: Backend (lint + security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # mysql2 gem のネイティブ拡張ビルドに必要
      - name: Install libmysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true
          working-directory: backend

      # 書き方のチェック（Rails 8 標準の rubocop-rails-omakase）
      - name: RuboCop
        run: bin/rubocop -f github

      # Rails のセキュリティ上の弱点を静的に検査
      - name: Brakeman
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error

      # 使っている gem の既知の脆弱性を検査
      - name: bundler-audit
        run: bin/bundler-audit

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 書き方のチェック（ESLint）と見た目の整形チェック（Prettier）
      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Run tests (vitest)
        run: npm test

      - name: Build (type-check + vite build)
        run: npm run build

  # E2E：本物のブラウザ（CI の機械に入っている Chrome）で、本物のアプリをつないで確かめる（frontend/e2e/）。
  # 手元と同じく MySQL（3306）・Rails（3000、development）・Vite（5173）を起動してから流す。
  # Rails は毎回新しく起動するので、ログインの回数制限（3 分に 10 回）には当たらない
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: reading_board_development
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7

      # mysql2 gem のネイティブ拡張ビルドに必要
      - name: Install libmysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true
          working-directory: backend

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare database
        working-directory: backend
        run: bin/rails db:prepare

      # サーバーは裏で動かしたまま次の手順へ進む（ジョブが終わると止まる）。ログは失敗したときに artifact で見る
      - name: Start Rails (3000) and Vite (5173)
        run: |
          (cd backend && bin/rails server -p 3000 > ../rails.log 2>&1 &)
          (cd frontend && npm run dev > ../vite.log 2>&1 &)

      # 画面（5173）と、Vite を通した API（未ログインなので 401）が返るまで待つ（最大 2 分）
      - name: Wait for servers
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null &&
               [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/session)" = "401" ]; then
              echo "サーバーが起動しました（${i} 回目）"; exit 0
            fi
            sleep 2
          done
          echo "サーバーが起動しませんでした"; cat rails.log vite.log; exit 1

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      # 失敗したときだけ、画面の写真・操作の記録（trace）・サーバーのログを残す（PR の Checks → Summary から落とせる）
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            rails.log
            vite.log
          retention-days: 7

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.6"

      - name: Format check
        run: terraform fmt -check -recursive

      # AWS 認証情報は CI に置かない（plan / apply は手元で実行）
      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
