# 部品（gem・npm・GitHub Actions・Terraform・Docker）の新しい版と弱点を、Dependabot に毎週調べてもらい、更新の PR を作ってもらう。
# minor と patch は種類ごとに 1 つの PR にまとめ、major（作りが変わることがある）は別の PR にする。
# patterns: ["*"] だけだと major もまとめに入るので、どのグループにも update-types を付ける（#334）
# PR の扱い（Issue は立てない・CI を確かめて squash merge・major は相談）は CLAUDE.md「Dependabot の PR」（2026-11-02、#315）
version: 2
updates:
  - package-ecosystem: bundler
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7（Go で作り直された版）は、typescript-eslint（ESLint）と vue-tsc（ビルドの型チェック）が
      # まだ対応しておらず、CI が落ちる（#323・#342）。6 系の minor・patch はこれまでどおり届く。
      # 外す条件：typescript-eslint の peerDependencies が 7 を含み（typescript-eslint/typescript-eslint#10940）、
      # vue-tsc でビルドが通る（`npm view typescript-eslint peerDependencies` で確かめる）
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
    groups:
      terraform:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
