# EC2 の nginx：SPA（frontend/dist）を配信し、/api と /up を Rails コンテナ（127.0.0.1:3000）へ転送する。
# 開発時の Vite プロキシと同じ役割（同一オリジンで Cookie 認証を成立させる）
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;

    server {
        listen 80 default_server;
        root /usr/share/nginx/reading-board;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ビルド成果物はファイル名にハッシュが付くので長期キャッシュ
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ ^/(api/|up$) {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            # CloudFront が付けた X-Forwarded-For（末尾が利用者の IP）をそのまま渡す。
            # SG で CloudFront 以外からは届かないため、Rails の remote_ip（回数制限のキー）が利用者の IP になる
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
